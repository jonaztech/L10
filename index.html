<meta charset="utf-8">
<title>Aztech Business System — L10 Facilitator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="slurp" content="noindex, nofollow">
<meta name="duckduckbot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --p0:#171D21; --p1:#202930; --p2:#2B353D; --p3:#36424B;
    --rule:#3E4B55; --ink:#E9EEF1; --dim:#93A2AD; --faint:#66757F;
    --amber:#F0A830; --go:#56A86A; --stop:#D9534A; --cool:#5B93C4;
    --fs:'Archivo','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--p0);color:var(--ink);font-family:var(--fs);font-size:16px;line-height:1.4;
       -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button{font-family:inherit;font-variant-numeric:tabular-nums;cursor:pointer;border:none;background:none;color:inherit}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  input,select{font-family:inherit;font-size:inherit}

  .wrap{display:flex;flex-direction:column;min-height:100vh}
  header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--p1);
         border-bottom:1px solid var(--rule);flex:none;flex-wrap:wrap}
  .brandmark{font-weight:700;font-size:19px;letter-spacing:.02em}
  .brandsub{color:var(--faint);font-size:14px;font-weight:500}
  .spacer{flex:1}
  .pace{font-size:16px;font-weight:600;color:var(--dim)}
  .pace b.behind{color:var(--stop)}
  .pace b.ahead{color:var(--go)}
  .totalclock{font-size:20px;font-weight:600;color:var(--dim)}
  .totalclock b{color:var(--ink);font-weight:700}
  .hbtn{padding:7px 15px;border-radius:3px;font-size:15px;font-weight:600;background:var(--p3);color:var(--ink)}
  .hbtn:hover{background:var(--rule)}
  .hbtn.go{background:var(--go);color:#0C1A10}
  .hbtn.stop{background:var(--stop);color:#fff}
  .hbtn.ghost{background:none;border:1px solid var(--rule);color:var(--dim)}
  .hbtn.ghost:hover{color:var(--ink);border-color:var(--dim)}
  .hbtn[disabled]{opacity:.35;cursor:not-allowed}

  main{display:grid;grid-template-columns:1.4fr 1fr;gap:1px;background:var(--rule);flex:1;min-height:0}
  .col{background:var(--p0);overflow-y:auto;min-height:0}

  .hero{padding:20px 24px 16px;background:var(--p1);border-bottom:1px solid var(--rule)}
  .hero .seg{font-size:19px;font-weight:600;color:var(--dim);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .hero .seg b{color:var(--ink);font-size:25px;font-weight:700;line-height:1.15}
  .readout{font-size:clamp(60px,10.5vw,128px);font-weight:700;line-height:.92;letter-spacing:-.02em;margin:6px 0 2px}
  .readout.warn{color:var(--amber)}
  .readout.over{color:var(--stop)}
  .bar{height:7px;background:var(--p0);border-radius:1px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--go);width:100%;transition:width .25s linear,background .3s}
  .bar i.warn{background:var(--amber)}
  .bar i.over{background:var(--stop)}
  .herobtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}

  .panel{padding:14px 24px 18px}
  .panel+.panel{border-top:1px solid var(--rule)}
  .panelhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .panelhead h2{font-size:15px;font-weight:600;color:var(--dim);letter-spacing:.03em}
  .mini{font-size:13px;font-weight:600;color:var(--faint);padding:3px 8px;border-radius:3px}
  .mini:hover{color:var(--ink);background:var(--p2)}

  .ag{display:flex;flex-direction:column;gap:2px}
  .agrow{display:grid;grid-template-columns:52px 12px 1fr auto auto;align-items:center;gap:10px;
         padding:10px 12px;border-radius:3px;background:var(--p1);border-left:3px solid transparent;
         font-size:17px;text-align:left;width:100%}
  .agrow:hover{background:var(--p2)}
  .agrow .at{color:var(--faint);font-size:15px;font-weight:600}
  .agrow .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--faint)}
  .agrow.done .dot{background:var(--go);border-color:var(--go)}
  .agrow.live{background:var(--p2);border-left-color:var(--amber)}
  .agrow.live .name{font-weight:700}
  .agrow.live .at{color:var(--amber)}
  .agrow.live .dot{border-color:var(--amber);background:var(--amber)}
  .agrow .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .agrow .plan{color:var(--faint);font-size:15px;font-weight:500}
  .agrow .act{font-size:15px;font-weight:600;color:var(--dim);min-width:52px;text-align:right}
  .agrow .act.over{color:var(--stop)}
  .agrow .act.under{color:var(--go)}

  .docs{display:flex;flex-direction:column;gap:3px}
  .doc{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;
       background:var(--p1);border-radius:3px;font-size:16px;text-align:left;width:100%;
       border-left:3px solid transparent;text-decoration:none;color:var(--ink)}
  .doc:hover{background:var(--p2)}
  .doc.forseg{border-left-color:var(--cool);background:var(--p2)}
  .doc .dico{color:var(--faint);font-size:15px;font-weight:700}
  .doc.forseg .dico{color:var(--cool)}
  .doc .dwhen{font-size:12px;color:var(--faint);font-weight:600;white-space:nowrap}
  .doc .dlabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .docgroup{font-size:12px;font-weight:700;color:var(--faint);letter-spacing:.06em;margin:12px 0 5px;text-transform:uppercase}
  .docgroup:first-child{margin-top:0}
  .doc.ref{background:none;border:1px solid var(--rule);border-left:3px solid var(--rule)}
  .doc.ref:hover{background:var(--p1);border-color:var(--dim)}

  .who{display:flex;flex-direction:column;gap:3px}
  .wrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 12px;
        border-radius:3px;background:var(--p1);font-size:17px}
  .wrow.out{opacity:.42}
  .wname{font-weight:500}
  .att{font-size:13px;font-weight:600;padding:5px 10px;border-radius:3px;border:1px solid var(--rule);
       color:var(--faint);min-width:74px}
  .att.room{color:var(--go);border-color:rgba(86,168,106,.5)}
  .att.remote{color:var(--cool);border-color:rgba(91,147,196,.5)}
  .attsum{font-size:13px;color:var(--faint);font-weight:600;margin-top:8px}

  .empty{color:var(--faint);font-size:15px;padding:14px 2px;line-height:1.5}
  .tdel{color:var(--faint);font-size:19px;line-height:1;padding:0 4px}
  .tdel:hover{color:var(--stop)}

  .veil{position:fixed;inset:0;background:rgba(10,14,16,.78);display:flex;align-items:center;
        justify-content:center;padding:24px;z-index:50}
  .modal{background:var(--p1);border:1px solid var(--rule);border-radius:4px;max-width:820px;width:100%;
         max-height:88vh;overflow-y:auto}
  .modal h3{font-size:20px;font-weight:700;padding:18px 22px 0}
  .modal .mbody{padding:14px 22px 22px}
  .modal .mfoot{display:flex;gap:8px;justify-content:flex-end;padding:0 22px 20px}
  .cfgrow{display:grid;grid-template-columns:1fr 84px auto;gap:6px;margin-bottom:6px;align-items:center}
  .cfgrow.person{grid-template-columns:1fr auto}
  .cfgrow input,.cfgrow select{background:var(--p0);border:1px solid var(--rule);color:var(--ink);
        padding:9px 10px;border-radius:3px;width:100%}
  .cfglabel{font-size:14px;color:var(--dim);font-weight:600;margin:16px 0 7px}
  .cfgtbl{width:100%;border-collapse:collapse;font-size:15px}
  .cfgtbl td{padding:6px 10px;border-bottom:1px solid var(--rule)}
  .cfgtbl td:first-child{color:var(--dim);white-space:nowrap}
  .cfgtbl td:last-child{text-align:right;color:var(--faint);white-space:nowrap}
  pre.summary{background:var(--p0);border:1px solid var(--rule);border-radius:3px;padding:14px;
    font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px;line-height:1.55;
    white-space:pre-wrap;max-height:48vh;overflow-y:auto}
  .note{font-size:14px;color:var(--faint);line-height:1.5;margin-top:10px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--p2);
    border:1px solid var(--rule);padding:10px 18px;border-radius:3px;font-size:15px;font-weight:600;
    z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.on{opacity:1}

  @media (max-width:940px){ main{grid-template-columns:1fr} .col{overflow-y:visible} }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>

<div class="wrap">
  <header>
    <span class="brandmark">Aztech Business System</span>
    <span class="brandsub" id="dateline"></span>
    <span class="spacer"></span>
    <span class="pace" id="pace"></span>
    <span class="totalclock">elapsed <b id="totalClock">0:00</b> / 1:30</span>
    <button class="hbtn ghost" id="popBtn">Pop out clock</button>
    <button class="hbtn ghost" id="voiceBtn">Voice on</button>
    <button class="hbtn ghost" id="cfgBtn">Configuration</button>
    <button class="hbtn go" id="startBtn">Start meeting</button>
  </header>

  <main>
    <div class="col">
      <div class="hero">
        <div class="seg"><b id="segName">Not started</b><span id="segPlan"></span></div>
        <div class="readout" id="readout">05:00</div>
        <div class="bar"><i id="bar"></i></div>
        <div class="herobtns">
          <button class="hbtn" id="pauseBtn" disabled>Pause</button>
          <button class="hbtn" id="nextBtn" disabled>Next item</button>
          <button class="hbtn ghost" id="plusBtn" disabled>+5 min</button>
          <span class="spacer"></span>
          <button class="hbtn stop" id="endBtn" disabled>End &amp; summarize</button>
        </div>
      </div>

      <div class="panel">
        <div class="panelhead"><h2>Agenda</h2><span class="spacer"></span>
          <span class="mini">scheduled / planned / actual</span></div>
        <div class="ag" id="agenda"></div>
      </div>
    </div>

    <div class="col">
      <div class="panel">
        <div class="panelhead"><h2>Attendance</h2><span class="spacer"></span>
          <span class="mini">tap to change</span></div>
        <div class="who" id="who"></div>
        <div class="attsum" id="attsum"></div>
      </div>

      <div class="panel">
        <div class="panelhead"><h2>Lists and documents</h2><span class="spacer"></span>
          <span class="mini">opens in a new tab</span></div>
        <div class="docs" id="docs"></div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIGURATION — edit this block, save the file, redistribute.
   Nothing is stored in the browser. Every copy is identical.
   ============================================================ */
const CONFIG = {

  start: '10:00',

  roster: [
    'Mark',
    'Jim Rowan',
    'Carmen Sithammavong',
    'Sabil Ahmed',
    'JP'
  ],

  agenda: [
    { name: 'Personal & Business Best Last Week',              min:  5 },
    { name: 'Our Universe — Good News / Bad News',              min: 10 },
    { name: 'To-Do List — Done / Not Done',                     min: 10 },
    { name: "Today's Red Flags — Sort, Resolve & To-Do's",      min: 40 },
    { name: 'Aztech Business System Discussion',                min: 20 },
    { name: 'Conclude — Best Thing Heard Today',                min:  5 }
  ],

  // seg: which agenda item (0-5), or null for "available all meeting"
  docs: [
    { label: 'Best',            url: '', seg: 0 },
    { label: 'Scorecard',       url: 'https://aro365516376.sharepoint.com/:x:/s/L10SharePoint/IQCCv4EtKM9hS4vKg67k5ENuATk2o83BndpT_CdRcdve8AA?e=6eU1Bk&nav=MTVfezhGQzZFNjNGLURDQzUtNDEyRC05ODNBLTUwMjU3MjI0QjFBOH0', seg: 1 },
    // { label: "To-Do's",         url: 'https://aro365516376.sharepoint.com/:x:/s/L10SharePoint/IQCCv4EtKM9hS4vKg67k5ENuATk2o83BndpT_CdRcdve8AA?e=NC4fLK&nav=MTVfezlBMUM4NDVDLTkyQzAtNDUyNS1BQzc2LUUzN0NDRTdGRDVDOX0', seg: 2 },
    // this comment is for the L10 Items in sharepoint link rather than excel sheet
    { label: "To-Do's",         url: 'https://aro365516376.sharepoint.com/sites/L10SharePoint/Lists/Lists%20and%20Documents%20by%20agenda%20item/AllItems.aspx?FilterField1=L10Items&FilterValue1=To%2DDo', seg: 2 },
    { label: "To-Do's Done",    url: 'https://aro365516376.sharepoint.com/sites/L10SharePoint/Lists/Lists%20and%20Documents%20by%20agenda%20item/AllItems.aspx?FilterField1=L10Items&FilterValue1=To%2DDo%20Done', seg: 2 },
    { label: 'Future Actions',  url: 'https://aro365516376.sharepoint.com/sites/L10SharePoint/Lists/Lists%20and%20Documents%20by%20agenda%20item/AllItems.aspx?FilterField1=L10Items&FilterValue1=Future%20Action', seg: 2 },
    { label: 'Red Flags',       url: 'https://aro365516376.sharepoint.com/sites/L10SharePoint/Lists/Lists%20and%20Documents%20by%20agenda%20item/AllItems.aspx?FilterField1=L10Items&FilterValue1=Red%20Flag', seg: 3 },
    { label: 'Red Flags Done',  url: 'https://aro365516376.sharepoint.com/sites/L10SharePoint/Lists/Lists%20and%20Documents%20by%20agenda%20item/AllItems.aspx?FilterField1=L10Items&FilterValue1=Red%20Flag%20Done', seg: 3 },
    { label: 'Company Rocks',   url: 'https://aro365516376.sharepoint.com/:x:/s/L10SharePoint/IQCCv4EtKM9hS4vKg67k5ENuATk2o83BndpT_CdRcdve8AA?e=B8VKGJ&nav=MTVfezM4MzRCRjFDLTA4NzAtNDVDNi1BQzBDLUIxOUU2RkJBQkRGOX0', seg: 4 },
    { label: 'Take Away',       url: '', seg: 5 }
  ],

  voice: true
};
/* ==================== END CONFIGURATION ==================== */

const cfg = {
  roster: CONFIG.roster.slice(),
  agenda: CONFIG.agenda.map(a=>({...a})),
  docs:   CONFIG.docs.map(d=>({...d})),
  start:  CONFIG.start,
  voice:  CONFIG.voice
};
let att={}, segActual=[];
let idx=-1, running=false, paused=false, ended=false;
let segStart=0, segElapsed=0, mtgStart=0, mtgElapsed=0;
let warned2=false, warnedEnd=false, ticker=null;

const $ = id => document.getElementById(id);

function init0(){
  cfg.roster.forEach(n=>{ att[n]='room'; });
  segActual = cfg.agenda.map(()=>0);
}
function saveCfg(){ /* configuration lives in the file; nothing to save */ }

const pad = n => String(n).padStart(2,'0');
function ms2clock(ms){ const s=Math.max(0,Math.round(ms/1000)); return Math.floor(s/60)+':'+pad(s%60); }
function ms2big(ms){ const neg=ms<0, s=Math.round(Math.abs(ms)/1000);
  return (neg?'+':'')+pad(Math.floor(s/60))+':'+pad(s%60); }
function schedTimes(){
  const [h,m]=cfg.start.split(':').map(Number);
  let t=h*60+(m||0); const out=[];
  cfg.agenda.forEach(s=>{ out.push(t); t+=s.min; });
  out.push(t);
  return out.map(v=>pad(Math.floor(v/60)%24)+':'+pad(v%60));
}
function totalPlanned(){ return cfg.agenda.reduce((a,s)=>a+s.min,0); }
function shortName(s){ return s.split('—')[0].split('--')[0].trim(); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let toastT=null;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }
function say(text){
  if(!cfg.voice || !('speechSynthesis' in window)) return;
  try{ const u=new SpeechSynthesisUtterance(text); u.rate=1; u.volume=1; speechSynthesis.speak(u); }catch(e){}
}

function startMeeting(){
  if(running) return;
  running=true; ended=false; mtgStart=Date.now(); mtgElapsed=0;
  beginSegment(0);
  say('Meeting started. First item, '+shortName(cfg.agenda[0].name)+', '+cfg.agenda[0].min+' minutes.');
  $('startBtn').style.display='none';
  ['pauseBtn','nextBtn','plusBtn','endBtn'].forEach(b=>$(b).disabled=false);
  ticker=setInterval(tick,250); render();
}
function beginSegment(i){ idx=i; segStart=Date.now(); segElapsed=0; warned2=false; warnedEnd=false; }
function commitSegment(){ if(idx>=0 && idx<segActual.length) segActual[idx]+=segElapsed; }
function nextSegment(){
  if(!running) return;
  commitSegment();
  if(idx+1>=cfg.agenda.length){ endMeeting(); return; }
  const n=cfg.agenda[idx+1]; beginSegment(idx+1);
  say('Next up, '+shortName(n.name)+', '+n.min+' minutes.'); render();
}
function togglePause(){
  if(!running) return;
  if(!paused){ paused=true; commitSegment(); segElapsed=0; segStart=Date.now();
    $('pauseBtn').textContent='Resume'; $('pauseBtn').classList.add('go'); }
  else { paused=false; segStart=Date.now();
    $('pauseBtn').textContent='Pause'; $('pauseBtn').classList.remove('go'); }
  render();
}
function addFive(){
  if(idx<0) return;
  cfg.agenda[idx].min+=5; warned2=false; warnedEnd=false;
  toast('+5 minutes on '+shortName(cfg.agenda[idx].name)+' (this meeting only)'); render();
}
function endMeeting(){
  if(!running) return;
  commitSegment(); running=false; ended=true; paused=false; clearInterval(ticker);
  say('Meeting concluded.');
  ['pauseBtn','nextBtn','plusBtn'].forEach(b=>$(b).disabled=true);
  showSummary(); render();
}
function tick(){
  if(!running||paused) return;
  const now=Date.now(); segElapsed=now-segStart; mtgElapsed=now-mtgStart;
  const planned=cfg.agenda[idx].min*60000;
  const left=planned-(segActual[idx]+segElapsed);
  if(!warned2 && left<=120000 && left>0){ warned2=true;
    say('Two minutes remaining on '+shortName(cfg.agenda[idx].name)+'.'); }
  if(!warnedEnd && left<=0){ warnedEnd=true; const nx=cfg.agenda[idx+1];
    say("Time's up on "+shortName(cfg.agenda[idx].name)+(nx?'. Next is '+shortName(nx.name)+'.':'. That concludes the agenda.')); }
  render();
}

function render(){
  $('totalClock').textContent = ms2clock(running?(Date.now()-mtgStart):(ended?mtgElapsed:0));
  const sch = schedTimes();

  if(running||ended){
    const doneMin = segActual.reduce((a,v,i)=>a+(i<idx?v:0),0)/60000;
    const shouldBe = cfg.agenda.slice(0,idx).reduce((a,s)=>a+s.min,0);
    const drift = Math.round(doneMin-shouldBe);
    const p=$('pace');
    if(idx<=0||drift===0) p.innerHTML='<b>on schedule</b>';
    else if(drift>0) p.innerHTML='<b class="behind">'+drift+'m behind</b>';
    else p.innerHTML='<b class="ahead">'+Math.abs(drift)+'m ahead</b>';
  } else $('pace').textContent='';

  if(idx>=0){
    const seg=cfg.agenda[idx], planned=seg.min*60000;
    const used=segActual[idx]+(running&&!paused?segElapsed:0);
    const left=planned-used;
    $('segName').textContent = seg.name+(paused?' — paused':'');
    $('segPlan').textContent = seg.min+' min · scheduled '+sch[idx]+'–'+sch[idx+1];
    const r=$('readout'), b=$('bar');
    r.textContent=ms2big(left);
    r.className='readout'+(left<=0?' over':left<=120000?' warn':'');
    b.style.width = left<=0?'100%':Math.max(0,Math.min(100,(left/planned)*100))+'%';
    b.className = left<=0?'over':left<=120000?'warn':'';
  }

  const ag=$('agenda'); ag.innerHTML='';
  cfg.agenda.forEach((s,i)=>{
    const used=segActual[i]+(i===idx&&running&&!paused?segElapsed:0);
    const el=document.createElement('button');
    el.className='agrow'+(i===idx&&running?' live':'')+((i<idx||(ended&&used>0))?' done':'');
    const diff=used-s.min*60000;
    const actCls=used===0?'':diff>30000?'over':diff<-30000?'under':'';
    el.innerHTML='<span class="at">'+sch[i]+'</span><span class="dot"></span>'
      +'<span class="name">'+esc(s.name)+'</span>'
      +'<span class="plan">'+s.min+'m</span>'
      +'<span class="act '+actCls+'">'+(used>0?ms2clock(used):'·')+'</span>';
    el.onclick=()=>{ if(running&&i!==idx){ commitSegment(); beginSegment(i);
      say('Jumping to '+shortName(s.name)+'.'); render(); } };
    ag.appendChild(el);
  });

  renderWho(); renderDocs(); renderPip();
}

function renderWho(){
  const w=$('who'); w.innerHTML='';
  let inroom=0, remote=0, away=0;
  cfg.roster.forEach(n=>{
    const st=att[n]||'room';
    if(st==='room') inroom++; else if(st==='remote') remote++; else away++;
    const row=document.createElement('div');
    row.className='wrow'+(st==='away'?' out':'');
    row.innerHTML='<span class="wname">'+esc(n)+'</span>';
    const a=document.createElement('button');
    a.className='att '+st;
    a.textContent = st==='room'?'In room':st==='remote'?'Remote':'Absent';
    a.onclick=()=>{ att[n]= st==='room'?'remote':st==='remote'?'away':'room'; renderWho(); };
    row.appendChild(a); w.appendChild(row);
  });
  $('attsum').textContent = inroom+' in room · '+remote+' remote'+(away?' · '+away+' absent':'');
}

function renderDocs(){
  const d=$('docs'); d.innerHTML='';
  const list=(cfg.docs||[]);
  if(!list.length){
    d.innerHTML='<div class="empty">Nothing linked yet. Add the SharePoint list views and documents in Setup — tie each to an agenda item, or leave it as reference to keep it available all meeting.</div>';
    return;
  }
  const tied=list.filter(x=>x.seg!==null&&x.seg!==undefined&&cfg.agenda[x.seg]).sort((a,b)=>a.seg-b.seg);
  const ref =list.filter(x=>!(x.seg!==null&&x.seg!==undefined&&cfg.agenda[x.seg]));

  function row(doc,isRef){
    const live = !isRef && doc.seg===idx && running;
    const el=document.createElement(doc.url?'a':'button');
    el.className='doc'+(live?' forseg':'')+(isRef?' ref':'');
    if(doc.url){
      el.href=doc.url;
      el.target='_blank';
      el.rel='noopener noreferrer';
      el.onclick=(ev)=>{
        ev.preventDefault();
        window.open(doc.url,'l10docs',
          'popup=true,width=1500,height=950,left=100,top=50');
      };
    }
    const when = isRef?'':shortName(cfg.agenda[doc.seg].name);
    el.innerHTML='<span class="dico">'+(doc.url?'\u2197':'\u00b7')+'</span>'
      +'<span class="dlabel">'+esc(doc.label)+'</span>'
      +'<span class="dwhen">'+esc(when)+'</span>';
    if(!doc.url) el.onclick=()=>toast('No link set for "'+doc.label+'" — add one in Setup');
    return el;
  }
  if(tied.length){
    const h=document.createElement('div'); h.className='docgroup';
    h.textContent='By agenda item'; d.appendChild(h);
    tied.forEach(doc=>d.appendChild(row(doc,false)));
  }
  if(ref.length){
    const h=document.createElement('div'); h.className='docgroup';
    h.textContent='Reference — available throughout'; d.appendChild(h);
    ref.forEach(doc=>d.appendChild(row(doc,true)));
  }
}

/* floating clock — real PiP when available, plain popup otherwise */
let pip=null, pipTimer=null;

const PIP_CSS = ''
 + '*{box-sizing:border-box;margin:0;padding:0}'
 + "body{background:#171D21;color:#E9EEF1;font-family:Archivo,'Segoe UI',Arial,sans-serif;"
 + 'font-variant-numeric:tabular-nums;padding:12px 14px;overflow:hidden}'
 + '#pseg{font-size:15px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}'
 + '#pread{font-size:62px;font-weight:700;line-height:1;letter-spacing:-.02em;margin:4px 0 0}'
 + '#pread.warn{color:#F0A830}#pread.over{color:#D9534A}'
 + '#pbar{height:6px;background:#0E1214;margin-top:7px;overflow:hidden}'
 + '#pbar i{display:block;height:100%;background:#56A86A;width:100%}'
 + '#pbar i.warn{background:#F0A830}#pbar i.over{background:#D9534A}'
 + '#pnext{font-size:13px;color:#66757F;font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}'
 + '#pbtns{display:flex;gap:6px;margin-top:9px}'
 + '#pbtns button{flex:1;padding:7px 0;background:#36424B;color:#E9EEF1;border:none;border-radius:3px;'
 + "font:600 14px Archivo,'Segoe UI',Arial,sans-serif;cursor:pointer}"
 + '#pbtns button:hover{background:#3E4B55}';

const PIP_BODY =
   '<div id="pseg">Not started</div><div id="pread">--:--</div>'
  +'<div id="pbar"><i></i></div><div id="pnext"></div>'
  +'<div id="pbtns"><button id="pp">Start</button><button id="pn">Next item</button></div>';

function wirePip(win){
  pip = win;
  const D = win.document;
  D.getElementById('pp').onclick = ()=>{ running ? togglePause() : startMeeting(); };
  D.getElementById('pn').onclick = nextSegment;
  win.addEventListener('pagehide', dropPip);
  win.addEventListener('unload', dropPip);
  clearInterval(pipTimer);
  pipTimer = setInterval(renderPip, 250);   // runs even while paused / not started
  $('popBtn').textContent = 'Close clock';
  renderPip();
}

function dropPip(){
  pip=null;
  clearInterval(pipTimer); pipTimer=null;
  $('popBtn').textContent='Pop out clock';
}

async function popOut(){
  if(pip && !pip.closed){                    // second click closes it
    try{ pip.close(); }catch(e){}
    dropPip();
    return;
  }
  if('documentPictureInPicture' in window){
    try{
      const w = await documentPictureInPicture.requestWindow({width:400,height:300});
      const st = w.document.createElement('style');
      st.textContent = PIP_CSS;
      w.document.head.appendChild(st);
      w.document.body.innerHTML = PIP_BODY;
      wirePip(w);
      return;
    }catch(e){ /* fall through to the plain popup */ }
  }
  openPlainClock();
}

function openPlainClock(){
  const w = window.open('','l10clock','popup=yes,width=400,height=320,left=40,top=40');
  if(!w){ toast('Allow pop-ups for this page, then try again'); return; }
  w.document.write('<!doctype html><html><head><meta charset="utf-8">'
    +'<title>L10 clock</title><style>'+PIP_CSS+'</style></head><body>'+PIP_BODY+'</body></html>');
  w.document.close();
  wirePip(w);
  toast('Clock opened in a window — pin it on top yourself');
}

function renderPip(){
  if(!pip || pip.closed){ if(pipTimer) dropPip(); return; }
  let D;
  try{ D = pip.document; }catch(e){ return; }
  const seg=D.getElementById('pseg'); if(!seg) return;
  const rd=D.getElementById('pread');
  const bw=D.getElementById('pbar'), bar=bw&&bw.firstElementChild;
  const nx=D.getElementById('pnext'), pp=D.getElementById('pp');

  if(pp) pp.textContent = !running ? 'Start' : (paused?'Resume':'Pause');

  if(idx<0){
    const first=cfg.agenda[0];
    seg.textContent='Not started';
    rd.textContent=ms2big(first.min*60000); rd.className='';
    if(bar){ bar.style.width='100%'; bar.className=''; }
    nx.textContent='first: '+shortName(first.name)+' · '+first.min+'m';
    return;
  }

  const s=cfg.agenda[idx], planned=s.min*60000;
  const used=segActual[idx]+(running&&!paused?segElapsed:0);
  const left=planned-used;
  seg.textContent = shortName(s.name)+(paused?' · paused':'');
  rd.textContent = ms2big(left);
  rd.className = left<=0?'over':left<=120000?'warn':'';
  if(bar){
    bar.style.width = left<=0?'100%':Math.max(0,Math.min(100,(left/planned)*100))+'%';
    bar.className = left<=0?'over':left<=120000?'warn':'';
  }
  const n=cfg.agenda[idx+1];
  nx.textContent = n ? ('next: '+shortName(n.name)+' · '+n.min+'m') : 'last item';
}

function showSetup(){
  const veil=document.createElement('div'); veil.className='veil';
  const sch=schedTimes();
  let rows='';
  cfg.agenda.forEach((a,i)=>{ rows+='<tr><td>'+sch[i]+'</td><td>'+esc(a.name)+'</td><td>'+a.min+'m</td></tr>'; });
  let links='';
  cfg.docs.forEach(d=>{
    const w = (d.seg===null||d.seg===undefined)?'any time':shortName(cfg.agenda[d.seg].name);
    links+='<tr><td>'+esc(d.label)+'</td><td>'+esc(w)+'</td><td>'+(d.url?'set':'<b style="color:var(--stop)">no link</b>')+'</td></tr>';
  });
  veil.innerHTML='<div class="modal"><h3>Configuration</h3><div class="mbody">'
   +'<div class="note" style="margin-top:0">This is read-only. The roster, agenda and links are written into the file itself, near the top, in a block marked CONFIGURATION. To change them: edit the file once, save it, and put the new copy in the L10 library so everyone syncs the same version. Nothing is stored in your browser.</div>'
   +'<div class="cfglabel">Meeting start</div><div>'+esc(cfg.start)+'</div>'
   +'<div class="cfglabel">Participants</div><div>'+cfg.roster.map(esc).join(' &nbsp;\u00b7&nbsp; ')+'</div>'
   +'<div class="cfglabel">Agenda</div><table class="cfgtbl">'+rows+'</table>'
   +'<div class="cfglabel">Lists and documents</div><table class="cfgtbl">'+links+'</table>'
   +'</div><div class="mfoot"><button class="hbtn go" id="cfgClose">Close</button></div></div>';
  document.body.appendChild(veil);
  veil.querySelector('#cfgClose').onclick=()=>veil.remove();
}

function buildSummary(){
  const d=new Date();
  const dateStr=d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const sch=schedTimes();
  let out='AZTECH BUSINESS SYSTEM — L10 LEADERSHIP MEETING\n'+dateStr+'\n';
  out+='Scheduled '+cfg.start+'–'+sch[sch.length-1]+' ('+totalPlanned()+' min) · actual '+ms2clock(mtgElapsed)+'\n\n';

  out+='ATTENDANCE\n';
  cfg.roster.forEach(n=>{
    out+='  '+n.padEnd(24)+(att[n]==='room'?'in room':att[n]==='remote'?'remote':'ABSENT')+'\n';
  });

  out+='\nAGENDA — planned vs actual\n';
  cfg.agenda.forEach((s,i)=>{
    const used=segActual[i]||0;
    const diff=Math.round((used-s.min*60000)/60000);
    const flag=used===0?'not reached':(diff>0?'+'+diff+'m over':diff<0?Math.abs(diff)+'m under':'on time');
    out+='  '+sch[i]+'  '+s.name+'\n';
    out+='         '+String(s.min+'m').padStart(4)+' planned   '+(used?ms2clock(used).padStart(6):'  —   ')+' actual   '+flag+'\n';
  });

  out+='\nLISTS\n';
  out+="  Red Flags, Future Actions and To-Do's are maintained in SharePoint.\n";
  out+='  Items closed this meeting were deleted from the list. These minutes are\n';
  out+='  the record of that closure.\n';

  out+='\n---\n';
  out+='Airtime per participant comes from the Teams transcript, not this sheet.\n';
  out+='Paste this alongside the transcript for full minutes.\n';
  return out;
}

function legacyCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;top:0;left:-9999px';
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0,ta.value.length);
  let ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){}
  ta.remove();
  return ok;
}

function copyToClipboard(text){
  window.focus();                     // clears the "document not focused" case
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text)
      .then(()=>toast('Copied'))
      .catch(()=>toast(legacyCopy(text)?'Copied':'Select and copy manually'));
  } else {
    toast(legacyCopy(text)?'Copied':'Select and copy manually');
  }
}

function showSummary(){
  const text=buildSummary();
  const veil=document.createElement('div'); veil.className='veil';
  veil.innerHTML='<div class="modal"><h3>Meeting summary</h3><div class="mbody">'
   +'<pre class="summary">'+esc(text)+'</pre>'
   +'<div class="note">Update the SharePoint lists before closing: delete what was completed, add what was raised, set owners, departments and priorities.</div>'
   +'</div><div class="mfoot">'
   +'<button class="hbtn ghost" id="sumCopy">Copy</button>'
   +'<button class="hbtn go" id="sumClose">Close meeting</button></div></div>';
  document.body.appendChild(veil);

  veil.querySelector('#sumCopy').onclick=()=>copyToClipboard(text);

  veil.querySelector('#sumClose').onclick=()=>{
    veil.remove();
    segActual=cfg.agenda.map(()=>0);
    idx=-1; ended=false; mtgElapsed=0; segElapsed=0;
    $('startBtn').style.display=''; $('endBtn').disabled=true;
    $('segName').textContent='Not started'; $('segPlan').textContent='';
    $('readout').textContent=ms2big(cfg.agenda[0].min*60000);
    $('readout').className='readout'; $('bar').style.width='100%'; $('bar').className='';
    render();
  };
}

$('startBtn').onclick=startMeeting;
$('pauseBtn').onclick=togglePause;
$('nextBtn').onclick=nextSegment;
$('plusBtn').onclick=addFive;
$('endBtn').onclick=endMeeting;
$('cfgBtn').onclick=showSetup;
$('popBtn').onclick=popOut;
$('popBtn').style.display='';
$('voiceBtn').onclick=()=>{
  cfg.voice=!cfg.voice;
  $('voiceBtn').textContent=cfg.voice?'Voice on':'Voice off';
  if(cfg.voice) say('Voice announcements on.');
};
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.code==='Space'){ e.preventDefault(); running?togglePause():startMeeting(); }
  if(e.key==='n'||e.key==='N') nextSegment();
});

(function init(){
  init0();
  $('dateline').textContent='L10 · '+new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
  $('readout').textContent=ms2big(cfg.agenda[0].min*60000);
  $('voiceBtn').textContent=cfg.voice?'Voice on':'Voice off';
  render();
})();
</script>
